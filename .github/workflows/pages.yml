name: Pages

# Build, check, and publish to github.io. The checks are not decoration: the
# content rules in src/content/validate.test.ts and the bundle checks in
# scripts/check-bundle.mjs are the enforcement behind claims the app makes to
# its reader, so a push that breaks one does not get published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and the newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tests, including the content rules
        run: npm test

      - name: Build
        run: npm run build

      - name: No key in the bundle, and it is still small
        run: npm run check:bundle

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
